<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<style>
  body {
    width: 320px;
    margin: 0;
    background: var(--fg-bg);
    color: var(--fg-ink);
    font-family: var(--fg-font);
    font-size: 14px;
  }
  .header { padding: 16px 16px 12px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
  .section { padding: 12px 16px; border-top: 1px solid var(--fg-line); }
  .section-label { font-size: 11px; color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
  .mode-row { display: flex; gap: 8px; }
  .mode-pill {
    border: 1px solid var(--fg-line); background: #fff; border-radius: 999px;
    padding: 6px 10px; font-size: 12px; font-family: inherit;
  }
  .mode-pill.on { background: var(--fg-ink); color: #fff; border-color: var(--fg-ink); }
  .mode-pill.stub { color: var(--fg-muted); }
  .intent { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .stats-row { display: flex; gap: 8px; }
  .stat-item { flex: 1; }
  .stat-val { font-size: 20px; font-weight: 800; }
  .stat-label { font-size: 11px; color: var(--fg-muted); }
  .btn-detail, .linkish {
    font-size: 12px; color: var(--fg-muted); background: none; border: none;
    cursor: pointer; font-family: inherit; text-decoration: underline; padding: 0;
  }
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .setting-input {
    width: 56px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--fg-line);
    text-align: center; font-family: inherit; font-size: 13px;
  }
  .footer { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--fg-ink); color: #fff; padding: 6px 14px; border-radius: 16px;
    font-size: 12px; opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--fg-muted); line-height: 1.5; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">搜搜记事本</div>
  <div class="header-sub">带着目的搜，贴有用的，跑偏了再拉回来</div>
</div>

<div class="section">
  <div class="section-label">模式</div>
  <div class="mode-row">
    <span class="mode-pill on">搜索模式</span>
    <span class="mode-pill stub">娱乐模式 · 后续</span>
  </div>
  <p class="hint">娱乐模式还没做。搜索模式里，跑偏是对照「这次目的」，不是永久封杀娱乐站。</p>
</div>

<div class="section">
  <div class="section-label">本次目的</div>
  <div class="intent" id="intent">打开小红书时会询问</div>
  <p class="hint" id="progress"></p>
</div>

<div class="section">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span class="section-label" style="margin:0">今日使用</span>
    <button class="btn-detail" id="btn-detail">详情</button>
  </div>
  <div class="stats-row">
    <div class="stat-item"><div class="stat-val" id="s-total">0</div><div class="stat-label">总分钟</div></div>
    <div class="stat-item"><div class="stat-val" id="s-active" style="color:var(--fg-ok)">0</div><div class="stat-label">在目的上</div></div>
    <div class="stat-item"><div class="stat-val" id="s-idle" style="color:var(--fg-warn)">0</div><div class="stat-label">闲逛/跑偏</div></div>
  </div>
</div>

<div class="section">
  <div class="section-label">模型</div>
  <div class="hint" id="key-status"></div>
  <input class="fg-input" id="api-key" type="password" placeholder="API Key（DeepSeek / 混元兼容）" style="margin-top:8px">
  <input class="fg-input" id="api-base" placeholder="API Base">
  <button class="fg-btn fg-btn-ink" id="btn-key" style="width:100%;margin-top:4px">保存 key</button>
</div>

<div class="section">
  <div class="section-label">时间设置</div>
  <div class="setting-row">
    <span>定时打断（搜索模式建议 0）</span>
    <input class="setting-input" id="s-interval" type="number" min="0" max="60" value="0">
  </div>
  <div class="setting-row">
    <span>B站每日上限</span>
    <input class="setting-input" id="s-bili-limit" type="number" min="0" max="999" value="60">
  </div>
  <div class="setting-row">
    <span>小红书每日上限</span>
    <input class="setting-input" id="s-xhs-limit" type="number" min="0" max="999" value="30">
  </div>
</div>

<div class="footer">
  <button class="fg-btn fg-btn-ink" id="btn-demo">打开广州三日游 Demo</button>
  <button class="fg-btn fg-btn-ghost" id="btn-panel">打开记事本</button>
  <button class="fg-btn fg-btn-ghost" id="btn-xhs">打开小红书</button>
  <button class="fg-btn fg-btn-ghost" id="save-btn">保存设置</button>
</div>
<div class="toast" id="toast">已保存</div>
<script src="popup.js"></script>
</body>
</html>
