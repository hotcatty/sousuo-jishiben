<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>搜完就走 · 广州三日游 Demo</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="panel.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f5f5f5; color: #2a2420; font-family: var(--fg-font); }
  .shell { display: flex; flex-direction: column; height: 100%; }
  .top {
    flex: 0 0 56px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: #fff; border-bottom: 1px solid #eee;
  }
  .logo { font-weight: 800; color: #ff2442; letter-spacing: 0.04em; }
  .searchbox {
    flex: 1; max-width: 380px; height: 34px; border: 1px solid #eadfd4;
    border-radius: 999px; padding: 0 14px; font: inherit; background: #faf7f3;
  }
  .meta { font-size: 12px; color: #8a7f76; }
  .cols { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 350px; min-height: 0; }
  .nb {
    border-left: 1px solid #eee; background: #fafafa;
    overflow: hidden; padding: 0; width: 350px; height: 100%;
  }
  .feed { overflow: auto; padding: 16px 20px 40px; }

  .coach {
    background: #fff7ec; border: 1px solid #e4cfc0; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; line-height: 1.55; margin-bottom: 14px; color: #5c5148;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card {
    background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer;
    border: 1px solid #eee; text-align: left; font: inherit; padding: 0; color: inherit;
  }
  .card:hover { border-color: #d9cfc6; }
  .card .cover { height: 104px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; padding: 12px; }
  .card .body { padding: 10px 12px 12px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
  .card p { margin: 0; font-size: 12px; color: #8a7f76; line-height: 1.45; }
  .note { background: #fff; border-radius: 16px; padding: 20px 24px 26px; max-width: 700px; }
  .note .back { border: 0; background: none; color: #8a7f76; font: inherit; cursor: pointer; padding: 0 0 10px; }
  .note h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.3; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .tag { background: #f4efe8; border-radius: 999px; padding: 3px 8px; font-size: 12px; }
  .note p { font-size: 15px; line-height: 1.75; color: #3f3833; margin: 0 0 12px; }
  .map {
    display: block; width: 100%; max-width: 420px; height: auto;
    border-radius: 10px; margin: 12px 0 10px; cursor: grab; border: 1px solid #eadfd4;
  }
  .map:active { cursor: grabbing; }
  .map div { border-radius: 10px; padding: 12px; color: #fff; font-size: 13px; line-height: 1.45; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .empty-feed { color: #8a7f76; font-size: 13px; padding: 24px 0; }

  .nb h2 {
    font-size: 11px; color: #8a7f76; letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0 0 8px;
  }
  .nb section:not(.fgp-set-block) {
    background: #fffdf9; border: 1px solid #eadfd4; border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .nb .intent { font-size: 17px; font-weight: 700; line-height: 1.35; margin: 6px 0; }
  .pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 3px 9px; }
  .pill.ok { color: #3f6b4e; background: #eef5f0; }
  .pill.bad { color: #a15c38; background: #f7eee8; }
  .thinking { font-size: 12px; color: #3f6b4e; background: #eef5f0; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .errbox { font-size: 12px; color: #a15c38; background: #f9ece4; border: 1px solid #e4cfc0; border-radius: 10px; padding: 10px; margin-top: 8px; line-height: 1.5; }
  .board {
    border: 1px dashed transparent; border-radius: 12px;
    padding: 10px; margin-bottom: 8px; background: #fffaf3; transition: background 0.12s, border-color 0.12s;
  }
  .board.over { border-color: #3f6b4e; background: #eef5f0; }
  .board.active { border-color: #2a2420; border-style: solid; }
  .board.is-new { border-color: #3f6b4e; border-style: solid; background: #f4faf6; }

  /* 待整理：收进来先停这儿，不去动右边已经认下的板块 */
  .staging { border-color: #d9c8b4 !important; background: #fffaf0 !important; }
  .staging.quiet { border-color: #eadfd4 !important; background: #fffdf9 !important; }
  .pend {
    font-size: 12px; line-height: 1.5; background: #fff; border: 1px solid #ecdfcd;
    border-radius: 8px; padding: 8px 9px; margin-bottom: 6px;
  }
  .pend-b { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .bigbtn {
    width: 100%; margin-top: 8px; border: 0; border-radius: 10px; cursor: pointer;
    background: #2a2420; color: #fff; font: inherit; font-size: 13px; font-weight: 700;
    padding: 11px 12px; transition: background 0.12s ease, transform 0.12s ease;
  }
  .bigbtn:hover { background: #453c35; }
  .bigbtn:active { transform: scale(0.99); }
  .bigbtn:disabled { background: #b8aca2; cursor: default; transform: none; }

  .changed {
    font-size: 12px; line-height: 1.5; color: #3f6b4e; background: #eef5f0;
    border: 1px solid #cfe0d4; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px;
  }
  .is-new { animation: fgin 0.48s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fgin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .tick {
    font-style: normal; font-size: 10px; font-weight: 700; color: #3f6b4e;
    background: #dcebe1; border-radius: 4px; padding: 1px 4px; margin-right: 5px;
  }
  .qual { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .qual.done { color: #8a7f76; }
  .qual.done s { color: #a89b90; }
  .board-tools { display: flex; align-items: center; gap: 6px; }
  .x {
    border: 0; background: none; color: #a89b90; font: inherit; font-size: 11px;
    cursor: pointer; padding: 0 3px; border-radius: 4px; flex: none;
    transition: color 0.12s ease, background 0.12s ease;
  }
  .x:hover { color: #a15c38; background: #f7eee8; }
  .linkbtn {
    border: 0; background: none; color: #5c5148; font: inherit; font-size: 11px;
    cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .linkbtn:hover { color: #a15c38; }
  .redo { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eadfd4; font-size: 11px; color: #8a7f76; }
  .tiny { font-size: 11px; color: #a89b90; line-height: 1.5; margin-top: 3px; }

  /* AI 想动旧结构，只能提议，不能自己动手 */
  .props { border-color: #cfd8e0 !important; background: #f7fafc !important; }
  .prop { border: 1px solid #dde5ec; border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; background: #fff; }
  .prop-t { font-size: 13px; font-weight: 700; line-height: 1.45; }
  .prop-w { font-size: 12px; color: #5c5148; line-height: 1.5; margin-top: 3px; }
  .mat-img {
    display: block; width: 100%; height: auto; border-radius: 6px;
    margin-bottom: 6px; border: 1px solid #f0e6da;
  }
  .board-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .board-n { font-weight: 400; color: #8a7f76; font-size: 11px; }
  .board-hint { font-size: 11px; color: #a89b90; margin-top: 8px; }
  .mat {
    position: relative; font-size: 12px; line-height: 1.5; background: #fff;
    border: 1px solid #f0e6da; border-radius: 8px;
    padding: 7px 22px 7px 9px; margin-top: 6px; cursor: grab;
  }
  .mat > .x { position: absolute; top: 5px; right: 4px; }

  /* 长材料全文都在 DOM 里，先夹成 4 行，点「展开全文」看全 */
  .mat-text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
    overflow: hidden; white-space: pre-wrap; word-break: break-word;
  }
  .mat-text.open { display: block; -webkit-line-clamp: unset; }
  .more {
    border: 0; background: none; color: #3f6b4e; font: inherit; font-size: 11px;
    cursor: pointer; padding: 3px 0 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .more:hover { color: #2a2420; }
  .mat:active { cursor: grabbing; }
  .mat-src { display: block; font-size: 11px; color: #8a7f76; margin-top: 3px; }
  .dropnew {
    border: 1px dashed #d2c4b6; border-radius: 12px; padding: 12px;
    text-align: center; font-size: 12px; color: #8a7f76; margin-top: 4px;
  }
  .dropnew.over { border-color: #3f6b4e; color: #3f6b4e; background: #eef5f0; }
  .draghint { font-size: 12px; color: #8a7f76; margin: -6px 0 14px; }
  .qual { font-size: 12px; line-height: 1.5; margin: 3px 0; }
  .qual.good { color: #3f6b4e; }
  .qual.bad { color: #a15c38; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    border: 1px solid #eadfd4; background: #fff; border-radius: 999px;
    padding: 6px 11px; font-size: 12px; font-family: inherit; cursor: pointer; color: #2a2420;
  }
  .chip:hover { border-color: #2a2420; }
  .chip.strong { background: #2a2420; color: #fff; border-color: #2a2420; }
  .clip { font-size: 12px; padding: 8px 0; border-bottom: 1px solid #f0e6da; line-height: 1.55; }
  .clip:last-child { border-bottom: none; }
  .clip .src { font-size: 11px; color: #8a7f76; margin-top: 3px; }
  .empty { font-size: 12px; color: #8a7f76; line-height: 1.55; }
  .narrow { background: #fbf3ec; border: 1px solid #e4cfc0; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .narrow h3 { margin: 0 0 6px; font-size: 14px; }
  .narrow p { margin: 0 0 10px; font-size: 13px; line-height: 1.55; color: #5c5148; }
  @media (max-width: 960px) {
    .cols { grid-template-columns: 1fr; }
    .nb { border-left: 0; border-top: 1px solid #eadfd4; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo">RED 模拟</div>
    <input class="searchbox" id="q" value="广州三日游" />
    <span class="meta" id="top-meta"></span>
  </header>
  <div class="cols">
    <main class="feed">
      <div class="coach" id="coach"></div>
      <div id="view"></div>
    </main>
    <aside class="nb" id="nb"></aside>
  </div>
</div>
<script src="panel.js"></script>
<script src="../lib/fg-lib.js"></script>
<script src="_harness-shim.js"></script>
<script src="demo.js"></script>
<script>
/* 测试走查：?filled=1 用现有 ADD_CLIP / ORGANIZE / RENAME 灌一条三日路线，方便点卡片和分区 */
(async function seedWalkthrough() {
  if (new URLSearchParams(location.search).get('filled') !== '1') return;
  const msg = (m) => new Promise((res) => chrome.runtime.sendMessage(m, res));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 50; i++) {
    const s = await msg({ type: 'GET_SESSION' });
    if (s && s.session && s.session.intent) break;
    await wait(40);
  }
  const cur = await msg({ type: 'GET_SESSION' });
  if (((cur.session && cur.session.clips) || []).length) return;
  const itinerary = [
    '广州三日游',
    '第1站：花城广场→海心沙亚运公园→广州塔→珠江夜游码头→二沙岛艺术公园',
    '第2站：陈家祠→荔湾湖公园→永庆坊→上下九步行街→沙面岛',
    '第3站：中山纪念堂→越秀公园→南越王博物院→北京路步行街→大佛寺',
    '-',
    '✌广州美食',
    '🔥南村柴火鸡饭'
  ].join('\n');
  await msg({ type: 'ADD_CLIP', clip: { title: '广州三日游', text: itinerary, source: 'note' } });
  await msg({ type: 'ORGANIZE_NOW' });
  await wait(200);
  const s = ((await msg({ type: 'GET_SESSION' })).session) || {};
  const b = (s.boards || [])[0];
  if (b) await msg({ type: 'RENAME_BOARD', boardId: b.id, name: '三日路线' });
  await msg({ type: 'ADD_CLIP', clip: { title: '又收一条', text: '沙面的欧陆建筑群适合慢慢逛，靠近珠江，傍晚光线好', source: 'note' } });
  if (window.FocusGuardPanel) {
    FocusGuardPanel.setTab(b ? b.id : 'inbox');
    await FocusGuardPanel.refresh();
  }
})();
</script>
</body>
</html>
