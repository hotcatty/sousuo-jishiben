<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用统计 — Focus Guard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f6f6f6;
    --card: #fff;
    --border: #f0f0f0;
    --text: #191919;
    --sub: #999;
    --active: #07c160;
    --idle: #fa5151;
    --radius: 10px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 0 48px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .page-title { font-size: 16px; font-weight: 700; }
  .page-date { font-size: 13px; color: var(--sub); }
  .week-nav { display: flex; align-items: center; gap: 10px; }
  .btn-nav {
    padding: 6px 14px; border-radius: 6px; font-size: 13px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-nav:hover { border-color: #ccc; }
  .week-label { font-size: 13px; color: var(--sub); min-width: 36px; text-align: center; }

  main { max-width: 900px; margin: 0 auto; padding: 28px 48px; }

  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 13px; color: var(--sub); font-weight: 500;
    letter-spacing: 0.4px; text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* ---- Summary Cards ---- */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sum-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 18px 16px;
  }
  .sum-val { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .sum-label { font-size: 12px; color: var(--sub); }

  /* ---- Platform Breakdown ---- */
  .platform-list { display: flex; flex-direction: column; gap: 10px; }
  .platform-row {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 16px 18px;
  }
  .platform-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .platform-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .color-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .platform-time { font-size: 22px; font-weight: 700; }
  .platform-time .unit { font-size: 13px; font-weight: 400; color: var(--sub); margin-left: 2px; }
  .split-bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: #f0f0f0; }
  .split-active { background: var(--active); transition: width 0.6s ease; }
  .split-idle { background: var(--idle); transition: width 0.6s ease; }
  .platform-footer { display: flex; gap: 20px; margin-top: 8px; }
  .pf-stat { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 4px; }
  .pf-stat .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pf-stat span { color: var(--text); font-weight: 600; }

  /* ---- Week Chart ---- */
  .chart-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 20px;
  }
  #chart-svg { display: block; width: 100%; height: auto; }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div>
    <div class="page-title">使用统计</div>
  </div>
  <div style="display:flex; align-items:center; gap:20px;">
    <div class="page-date" id="page-date"></div>
    <div class="week-nav">
      <button class="btn-nav" id="btn-prev">← 上周</button>
      <span class="week-label" id="week-label">本周</span>
      <button class="btn-nav" id="btn-next" disabled style="opacity:0.4;cursor:default;">下周 →</button>
    </div>
  </div>
</header>

<main>
  <!-- 今日总览 -->
  <div class="section">
    <div class="section-title">今日</div>
    <div class="summary-row">
      <div class="sum-card">
        <div class="sum-val" id="s-total">0</div>
        <div class="sum-label">总分钟</div>
      </div>
      <div class="sum-card">
        <div class="sum-val" id="s-active" style="color:var(--active)">0</div>
        <div class="sum-label">主动使用</div>
      </div>
      <div class="sum-card">
        <div class="sum-val" id="s-idle" style="color:var(--idle)">0</div>
        <div class="sum-label">闲逛</div>
      </div>
      <div class="sum-card">
        <div class="sum-val" id="s-ratio" style="color:var(--text)">0%</div>
        <div class="sum-label">主动率</div>
      </div>
    </div>
  </div>

  <!-- 平台详情 -->
  <div class="section">
    <div class="section-title">平台详情</div>
    <div class="platform-list" id="platform-list"></div>
  </div>

  <!-- 本周趋势 -->
  <div class="section">
    <div class="section-title" id="chart-title">本周趋势</div>
    <div class="chart-card"></div>
  </div>
</main>

<script src="stats.js"></script>
</body>
</html>
